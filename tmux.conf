# ~/.tmux.conf

# Use C-a as prefix
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Basic settings
set -g mouse on
setw -g mode-keys vi
set -g set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Pane navigation (prefix + vim keys)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Window switching
bind -n S-Left previous-window
bind -n S-Right next-window
bind -n M-h previous-window
bind -n M-l next-window

# Splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind q kill-pane

# Reload config
bind-key r source-file ~/.tmux.conf \; display "Reloaded"

# Disable bells
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Catppuccin
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# Status bar (must be after catppuccin plugin)
set -g status-position bottom
set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right ""

# True color and extended keys (pass through Shift+Enter, etc.)
set -g default-terminal "tmux-256color"
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:extkeys"
set -as terminal-features ",tmux-256color:extkeys"

# Explicitly pass through Shift+Enter
bind-key -n S-Enter send-keys Escape "[13;2u"

# Vim-tmux-navigator (seamless C-h/j/k/l between vim and tmux)
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +${vim_pattern}'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Copy to macOS clipboard
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# TPM (keep at bottom)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
run '~/.tmux/plugins/tpm/tpm'
